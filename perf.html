<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Rapport receiver test</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1d1c; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #report { position: fixed; left: 3vw; top: 3vh; color: #f5f7e0; font: 2.4vh/1.5 monospace; white-space: pre; }
</style>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
<canvas id="stage"></canvas>
<div id="report"></div>
<script>
// Measures how many of Oscillon's faint additive lines this device can compute and draw per frame.
// Geometry is regenerated every frame, as the real visuals do. Each stage runs for STAGE_SECONDS.
const NAMESPACE = 'urn:x-cast:com.klenke.graphomat.perf';
const STAGE_SECONDS = Number(new URLSearchParams(location.search).get('seconds')) || 10;
const SEGMENTS_PER_TRACE = 170;
const STAGES = [2000, 5000, 10000, 20000, 44000];

const canvas = document.getElementById('stage');
const reportEl = document.getElementById('report');
const results = [];
let cast_ = null;

function report(done) {
  const lines = [info(), ...results.map(r =>
    `${String(r.lines).padStart(6)} lines  ${r.fps.toFixed(1).padStart(5)} fps  worst frame ${r.worstMs.toFixed(0)} ms`)];
  reportEl.textContent = lines.join('\n') + (done ? '\nDone.' : '');
  try {
    if (cast_) cast_.sendCustomMessage(NAMESPACE, undefined, { info: info(), results, done });
  } catch (error) {
    // No sender is listening. The results are still on screen.
  }
}

const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' })
        || canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' });
const isGL2 = typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext;
const instancing = gl && !isGL2 ? gl.getExtension('ANGLE_instanced_arrays') : null;

function info() {
  if (!gl) return 'No WebGL';
  const debug = gl.getExtension('WEBGL_debug_renderer_info');
  const gpu = debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : 'unknown GPU';
  return `${isGL2 ? 'WebGL2' : instancing ? 'WebGL1+instancing' : 'WebGL1, no instancing'} | ${gpu} | ${canvas.width}x${canvas.height}`;
}

// Outside a Cast session, such as in a TV's browser app, the test still runs and shows results on screen.
if (window.cast && cast.framework && location.hostname !== 'localhost') {
  try {
    const context = cast.framework.CastReceiverContext.getInstance();
    const options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = true;
    options.customNamespaces = { [NAMESPACE]: cast.framework.system.MessageType.JSON };
    context.start(options);
    cast_ = context;
  } catch (error) {
    cast_ = null;
  }
}

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

function run() {
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(innerWidth * ratio);
  canvas.height = Math.round(innerHeight * ratio);
  const width = canvas.width, height = canvas.height;

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, `
    attribute vec2 corner;
    attribute vec2 a;
    attribute vec2 b;
    attribute float alpha;
    uniform vec2 viewport;
    uniform float halfWidth;
    varying float across;
    varying float light;
    void main() {
      vec2 delta = b - a;
      float len = max(length(delta), 0.0001);
      vec2 dir = delta / len;
      vec2 normal = vec2(-dir.y, dir.x);
      float reach = halfWidth + 1.0;
      vec2 pixel = a + dir * corner.x * len + normal * corner.y * reach;
      across = corner.y * reach;
      light = alpha;
      gl_Position = vec4(pixel.x / viewport.x * 2.0 - 1.0, 1.0 - pixel.y / viewport.y * 2.0, 0.0, 1.0);
    }`));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, `
    precision highp float;
    uniform float halfWidth;
    varying float across;
    varying float light;
    void main() {
      float c = exp(-2.5 * across * across / (halfWidth * halfWidth)) * light;
      gl_FragColor = vec4(vec3(0.96, 0.97, 0.88) * c, c);
    }`));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);

  const cornerBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, cornerBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, -1, 1, -1, 0, 1, 1, 1]), gl.STATIC_DRAW);
  const corner = gl.getAttribLocation(program, 'corner');
  gl.enableVertexAttribArray(corner);
  gl.vertexAttribPointer(corner, 2, gl.FLOAT, false, 0, 0);

  const divisor = (location, value) => isGL2 ? gl.vertexAttribDivisor(location, value)
                                             : instancing.vertexAttribDivisorANGLE(location, value);
  const drawInstanced = count => isGL2 ? gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, count)
                                       : instancing.drawArraysInstancedANGLE(gl.TRIANGLE_STRIP, 0, 4, count);

  const data = new Float32Array(STAGES[STAGES.length - 1] * 5 + 5 * SEGMENTS_PER_TRACE);
  const lineBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, lineBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, data.byteLength, gl.DYNAMIC_DRAW);
  for (const [name, size, offset] of [['a', 2, 0], ['b', 2, 8], ['alpha', 1, 16]]) {
    const location = gl.getAttribLocation(program, name);
    gl.enableVertexAttribArray(location);
    gl.vertexAttribPointer(location, size, gl.FLOAT, false, 20, offset);
    divisor(location, 1);
  }

  gl.uniform2f(gl.getUniformLocation(program, 'viewport'), width, height);
  const halfWidth = Math.max(0.6, Math.min(width, height) / 700);
  gl.uniform1f(gl.getUniformLocation(program, 'halfWidth'), halfWidth);
  gl.viewport(0, 0, width, height);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.clearColor(0.10, 0.115, 0.11, 1);

  // The same two-beam figure as Oscillon.swift, so the CPU load is realistic too.
  function generate(lineCount, time) {
    const traces = Math.max(2, Math.round(lineCount / SEGMENTS_PER_TRACE));
    const cx = width / 2, cy = height / 2, radius = Math.min(width, height) * 0.4;
    const rotation = time * 0.1, cosR = Math.cos(rotation), sinR = Math.sin(rotation);
    const sweep = time * 0.3;
    const brightness = 0.04 * 260 / traces;
    let n = 0;
    for (let trace = 0; trace < traces; trace++) {
      const t = trace / (traces - 1);
      const eased = t * t * (3 - 2 * t);
      const main = 0.94 - 0.60 * eased;
      const counter = main * (0.04 + 0.30 * eased);
      const phase = sweep + (t - 0.5) * 0.8;
      const ripple = 0.02 * Math.sin(Math.PI * t);
      const alpha = brightness * Math.min(1, (1 - t) * 14) * (0.62 + 0.38 * eased);
      let px = 0, py = 0;
      for (let side = 0; side <= SEGMENTS_PER_TRACE; side++) {
        const s = side / SEGMENTS_PER_TRACE * 2 * Math.PI;
        const c = 9 * s + time * 0.7 + t * 3, bAngle = -3 * s + phase;
        const x = main * Math.cos(s) + counter * Math.cos(bAngle) + ripple * Math.cos(c);
        const y = 0.92 * main * Math.sin(s + 0.22) + counter * Math.sin(bAngle) + ripple * Math.sin(c);
        const qx = cx + (x * cosR - y * sinR) * radius;
        const qy = cy + (x * sinR + y * cosR) * radius;
        if (side > 0) {
          data[n++] = px; data[n++] = py; data[n++] = qx; data[n++] = qy; data[n++] = alpha;
        }
        px = qx; py = qy;
      }
    }
    return n / 5;
  }

  let stage = 0, stageStart = 0, frames = 0, last = 0, worst = 0;
  function frame(now) {
    if (!stageStart) { stageStart = now; last = now; }
    const delta = now - last;
    last = now;
    // The first second of a stage is settling, so it doesn't count.
    if (now - stageStart > 1000) { frames++; worst = Math.max(worst, delta); }

    const count = generate(STAGES[stage], now / 1000);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, data.subarray(0, count * 5));
    gl.clear(gl.COLOR_BUFFER_BIT);
    drawInstanced(count);

    if (now - stageStart > STAGE_SECONDS * 1000) {
      results.push({ lines: count, fps: frames / (STAGE_SECONDS - 1), worstMs: worst });
      report(stage === STAGES.length - 1);
      stage++;
      if (stage === STAGES.length) return;
      stageStart = 0; frames = 0; worst = 0;
    }
    requestAnimationFrame(frame);
  }
  report(false);
  requestAnimationFrame(frame);
}

window.addEventListener('error', event => {
  if (event.filename && event.filename.includes('gstatic.com')) return; // The Cast SDK, outside a Cast device.
  reportEl.textContent = `${info()}\nError: ${event.message}`;
});
if (gl && (isGL2 || instancing)) run(); else report(true);
</script>
</body>
</html>
